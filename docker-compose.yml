version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    env_file:
      - .env
    environment:
      - ENV=dev
      - MONGODB_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb
  
  mongodb:
    image: mongo:7.0
    container_name: kuberan-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=kuberan
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

